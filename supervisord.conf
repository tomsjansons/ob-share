[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :5 -extension GLX -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s
user=obsidian
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log

[program:openbox]
command=/usr/bin/openbox-session
user=obsidian
environment=DISPLAY=":5",HOME="/home/obsidian"
autorestart=true
priority=200
startsecs=2
startretries=10
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox_err.log

[program:x11vnc]
command=/usr/bin/x11vnc -rfbport 5900 -listen 0.0.0.0 -display :5 -rfbauth /home/obsidian/.vnc/passwd -forever -shared
user=obsidian
autorestart=true
priority=300
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log

[program:obsidian]
command=/usr/bin/obsidian --no-sandbox
user=obsidian
environment=DISPLAY=":5",HOME="/home/obsidian"
autorestart=true
priority=400
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/obsidian.log
stderr_logfile=/var/log/supervisor/obsidian_err.log

[program:chromium]
; Google Chrome browser for logging into websites (Twitter, Reddit, etc.)
; Sessions are shared with headless browser for URL extraction
command=/usr/bin/google-chrome-stable --user-data-dir=/data/chromium-profile --no-sandbox --disable-gpu
user=obsidian
environment=DISPLAY=":5",HOME="/home/obsidian"
autostart=true
autorestart=true
priority=450
startsecs=3
startretries=5
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium_err.log

[program:nextjs]
command=node /app/server.js
directory=/app
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
autorestart=true
priority=10
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

