# fly.toml app configuration file generated for ob-share on 2026-01-03T08:39:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ob-share'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'obsidian_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  count = 1

