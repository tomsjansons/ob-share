# fly.toml app configuration file generated for ob-share on 2026-01-03T08:39:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ob-share'
primary_region = 'arn'

[build]

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 900

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[env]
  DATABASE_URL = "/data/ob-share.db"
  BETTER_AUTH_URL = "https://ob-share.fly.dev"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"

[[mounts]]
  source = 'obsidian_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

