services:
  obsidian:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OBSIDIAN_VERSION: "1.7.7"
    container_name: obsidian-sync
    restart: unless-stopped
    ports:
      - "5900:5900" # VNC port
      - "3000:3000" # Next.js HTTP port
    volumes:
      - ./data:/data
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-obsidian}
      - SCREEN_RESOLUTION=${SCREEN_RESOLUTION:-1280x720x24}
      - DATABASE_URL=/data/ob-share.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOW_LIST_USERS=${ALLOW_LIST_USERS:-tomsjansons}
    # Required for GPU acceleration (optional)
    # devices:
    #   - /dev/dri:/dev/dri
    # Security settings for running Obsidian
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"

volumes:
  obsidian-config:
    name: obsidian-config
