<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share with Note - ob-share</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: #7c3aed;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .url-preview {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #888;
      word-break: break-all;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .url-preview .title {
      color: #e5e5e5;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #e5e5e5;
    }

    textarea {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    textarea::placeholder {
      color: #666;
    }

    /* Share mode toggle */
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .mode-btn:hover {
      border-color: #444;
      color: #e5e5e5;
    }

    .mode-btn.selected {
      border-color: #7c3aed;
      background: rgba(124, 58, 237, 0.1);
      color: #e5e5e5;
    }

    .mode-btn .mode-label {
      display: block;
      margin-bottom: 2px;
    }

    .mode-btn .mode-desc {
      font-size: 10px;
      font-weight: 400;
      color: #666;
    }

    .mode-btn.selected .mode-desc {
      color: #888;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #7c3aed;
      color: #fff;
    }

    .btn-primary:hover {
      background: #6d28d9;
    }

    .btn-primary:disabled {
      background: #4c2899;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #333;
      color: #e5e5e5;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      text-align: center;
    }

    kbd {
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 11px;
    }

    .badge {
      display: inline-block;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 600;
      border-radius: 3px;
      margin-left: 6px;
      vertical-align: middle;
      text-transform: uppercase;
    }

    .badge-new {
      background: rgba(124, 58, 237, 0.3);
      color: #a78bfa;
    }
  </style>
</head>
<body>
  <h1>
    <span class="logo">O</span>
    Share with Note
  </h1>

  <div class="url-preview">
    <div class="title" id="pageTitle">Loading...</div>
    <div id="pageUrl"></div>
  </div>

  <div class="form-group">
    <label>Share Mode</label>
    <div class="mode-toggle">
      <button type="button" class="mode-btn selected" id="modeUrlOnly" data-mode="url_only">
        <span class="mode-label">URL Only</span>
        <span class="mode-desc">Fast, server fetches</span>
      </button>
      <button type="button" class="mode-btn" id="modeFullPage" data-mode="full_page">
        <span class="mode-label">Full Page<span class="badge badge-new">New</span></span>
        <span class="mode-desc">For private pages</span>
      </button>
    </div>
  </div>

  <div class="form-group">
    <label for="note">Add a note (optional)</label>
    <textarea
      id="note"
      placeholder="Add context, thoughts, or a reminder..."
      autofocus
    ></textarea>
  </div>

  <div class="button-group">
    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
    <button type="button" class="btn-primary" id="shareBtn">Share</button>
  </div>

  <p class="hint">Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to share quickly</p>

  <script src="note-popup.js"></script>
</body>
</html>
