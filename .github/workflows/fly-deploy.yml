name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy existing machines
        run: |
          # List all machines and extract their IDs
          MACHINE_IDS=$(flyctl machines list -a ob-share --json | jq -r '.[].id')

          # Destroy each machine if any exist
          if [ -n "$MACHINE_IDS" ]; then
            for MACHINE_ID in $MACHINE_IDS; do
              echo "Destroying machine: $MACHINE_ID"
              flyctl machines destroy "$MACHINE_ID" -a ob-share -f
            done
          else
            echo "No existing machines to destroy"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --ha=false --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
